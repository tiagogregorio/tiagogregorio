name: Perfil - Cards e Pac-Man

on:
  # Semanal (domingo, 03:00 UTC = meia-noite em Brasília).
  # Diário gera ~2 commits automáticos por dia no seu histórico — semanal é mais limpo.
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

# Sem "push: main" para evitar rodar o workflow inteiro a cada edição do README.
# Use o botão "Run workflow" quando quiser atualizar na hora.

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — Animações do gráfico de contribuições (usa só o GITHUB_TOKEN padrão)
  # Gera Pac-Man E cobrinha na MESMA pasta dist/ e publica tudo de uma vez.
  # Importante: a action de publicação SUBSTITUI o conteúdo da branch "output".
  # Se você publicar em dois passos separados, o segundo apaga o primeiro.
  # ---------------------------------------------------------------------------
  animacoes:
    name: Gerar Pac-Man e cobrinha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Gerar Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Outros jogos disponíveis: breakout, galaga, puzzle-bobble, bomberman, minesweeper
          games: "pacman"
          hide_month_labels: "false"

      # Opcional: mantenha se ainda quiser a cobrinha junto do Pac-Man.
      # Pode remover este passo inteiro se for usar só o Pac-Man.
      - name: Gerar cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar tudo na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # JOB 2 — Cards de estatísticas (PRECISA do secret SUMMARY_GITHUB_TOKEN)
  # O token deve ser fine-grained, somente leitura, e precisa ser renovado
  # antes de expirar — se ele vencer, este job falha e os cards congelam.
  # ---------------------------------------------------------------------------
  cards:
    name: Gerar cards de estatisticas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Gerar os cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: -3
          EXCLUDE: ""
          AUTO_PUSH: true
