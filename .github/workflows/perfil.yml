name: Perfil - Cards e Animacao

on:
  # Executa automaticamente uma vez por semana (domingos às 03:00 UTC)
  schedule:
    - cron: "0 3 * * 0"
  # Permite a execução manual pelo botão "Run workflow"
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 - Animacao do Pac-Man
  # Gera o Pac-Man e publica na branch "output"
  # ---------------------------------------------------------------------------
  animacoes:
    name: Gerar Animacao Pac-Man
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Gerar Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          hide_month_labels: "false"

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # JOB 2 - Cards de estatisticas 
  # ---------------------------------------------------------------------------
  cards:
    name: Gerar cards de estatisticas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Gerar os cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: -3
          EXCLUDE: ""
          AUTO_PUSH: true
